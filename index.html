<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>West Road Life</title>
    <meta name="description" content="Drive London and Lagos: dodge traffic, pick up passengers, earn pounds and naira, and challenge friends to beat your drive." />
    <meta name="theme-color" content="#142b4e" />
    <meta property="og:title" content="West Road Life" />
    <meta property="og:description" content="Drive a red double-decker over Tower Bridge or a yellow danfo through Lagos. Can you beat my drive?" />
    <meta property="og:image" content="/art/london.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/Exo2-ExtraBoldItalic.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Exo2-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="shade" aria-hidden="true"></div>
      <div id="hurt" aria-hidden="true"></div>
      <div id="hud" hidden>
        <div class="hud-top">
          <div class="money-panel">
            <div>
              <span class="lbl">Money earned</span>
              <span class="amt disp" id="h-money">£0</span>
            </div>
            <button type="button" class="pause disp" id="b-pause" aria-label="Pause">II</button>
          </div>
          <div class="strip">
            <span id="h-place">London / Route</span>
            <span class="health"><span class="lbl">Health</span><span class="marks" id="h-health"></span></span>
          </div>
          <div class="info" id="h-info"></div>
          <div class="target" id="h-target" hidden></div>
          <div class="step-tag" id="h-step" hidden></div>
          <div class="card" id="h-card" role="status" aria-live="polite" hidden><b class="disp" id="h-card-title"></b><span id="h-card-line"></span></div>
          <div class="shout" id="h-shout" hidden></div>
        </div>
        <div id="h-pops" aria-hidden="true"></div>
        <div class="swipe-hints" id="h-swipe" hidden aria-hidden="true"><span class="disp">Left</span><span class="disp">Right</span></div>
        <div class="countdown" id="h-count" hidden>
          <div class="num disp" id="h-count-num">3</div>
          <div class="pill disp" id="h-count-text">Ready to drive?</div>
        </div>
        <div class="hud-bottom">
          <div class="progress" id="h-progress" hidden><i id="h-progress-bar"></i></div>
          <div class="hint" id="h-hint">Hold road to speed up</div>
          <div class="controls">
            <button type="button" class="ctl brake disp" id="b-brake">Brake</button>
            <button type="button" class="ctl gas disp" id="b-gas">Gas</button>
          </div>
        </div>
      </div>
      <div id="screens"></div>
      <div id="loading">
        <div class="loading-art" id="loading-art"></div>
        <div class="loading-body">
          <div class="wordmark"><span class="disp w1">West Road</span><span class="disp w2">Life</span></div>
          <p class="disp" id="loading-text">Getting ready</p>
          <div class="bar"><i id="loading-bar"></i></div>
          <p class="small" id="loading-pct">Loading / 0%</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
